

name: Build iOS Tweak (Rootless)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build Rootless Debian Package
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Debian Package
        uses: actions/upload-artifact@v6
        with:
          name: Rootless-Debian-Package
          path: packages/*.deb
          if-no-files-found: error
