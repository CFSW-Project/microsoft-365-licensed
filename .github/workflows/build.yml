
name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Theos
        uses: theos/setup-theos@main

      - name: Build Debian Package
        run: |
          make clean
          make package

      - name: Upload Debian Package
        uses: actions/upload-artifact@v6
        with:
          name: Debian-Package
          path: packages/*.deb
