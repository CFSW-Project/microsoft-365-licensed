
name: Build ms365Licensed (iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List schemes
        run: |
          xcodebuild -list -project ms365Licensed/ms365Licensed.xcodeproj || \
          xcodebuild -list -project ms365Licensed.xcodeproj

      - name: Build dylib for iOS
        run: |
          xcodebuild \
            -project ms365Licensed/ms365Licensed.xcodeproj \
            -scheme ms365Licensed \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tail -20

      - name: Locate & package dylib
        run: |
          DYLIB=$(find build/Build/Products -name "ms365Licensed.dylib" | head -1)
          echo "Found: $DYLIB"
          lipo -info "$DYLIB"
          mkdir -p artifact
          cp "$DYLIB" artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms365Licensed-ios
          path: artifact/ms365Licensed.dylib
